name: CI & Agent Graph Evaluation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-test:
    name: Agent Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest tests/test_agents.py -v

  graph-eval:
    name: LangGraph State Machine Evaluation
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest tests/test_evaluation.py -v --tb=short
